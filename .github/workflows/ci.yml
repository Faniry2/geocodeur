name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    # Chaque lundi : vérifie que le bundle BAN du moment fonctionne toujours avec nos images
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    name: Tests (données de Paris)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Construction des images
        run: docker compose --profile '*' build

      - name: Construction d'un bundle à partir des données BAN de Paris
        run: |
          mkdir -p data
          curl -fsSL -o data/adresses-addok-75.ndjson.gz \
            https://adresse.data.gouv.fr/data/ban/adresses/latest/addok/adresses-addok-75.ndjson.gz
          ./build-package/run.sh

      - name: Installation du bundle avec update-data.sh
        run: BUNDLE_URL="file://$PWD/dist/prebuilt-bundle.zip" ./update-data.sh

      - name: Tests fonctionnels
        run: tests/smoke.sh

      - name: Mise à jour sans coupure (requêtes en continu pendant la bascule)
        run: |
          (ko=0; while [ ! -f /tmp/stop ]; do
             curl -sf --max-time 5 "http://localhost:7878/search?q=rue+de+rivoli" | grep -q '"features": *\[ *{' || ko=$((ko+1))
             sleep 0.1
           done; echo "$ko" > /tmp/ko) &
          BUNDLE_URL="file://$PWD/dist/prebuilt-bundle.zip" HOT_SWAP=always ./update-data.sh --force
          touch /tmp/stop; wait
          echo "Requêtes en échec : $(cat /tmp/ko)"
          [ "$(cat /tmp/ko)" = 0 ]
          grep -q COMPOSE_PROFILES=green .env
          tests/smoke.sh

      - name: Bundle cassé (doit être rejeté sans coupure)
        run: |
          mkdir broken && cd broken
          unzip -q ../dist/prebuilt-bundle.zip
          head -c 100000 /dev/urandom > dump.rdb
          zip -q ../dist/broken.zip addok.conf addok.db dump.rdb
          cd ..
          if BUNDLE_URL="file://$PWD/dist/broken.zip" START_TIMEOUT=120 ./update-data.sh --force; then exit 1; fi
          grep -q COMPOSE_PROFILES=green .env
          tests/smoke.sh

      - name: Test de l'image standalone
        run: |
          docker compose down
          docker build -t geocodeur-infostat/addok-standalone:test addok-standalone
          docker run -d --name standalone -p 7878:7878 -v "$PWD/dist:/bundle:ro" \
            -e PRE_INDEXED_DATA_URL=file:///bundle/prebuilt-bundle.zip \
            geocodeur-infostat/addok-standalone:test
          timeout 300 bash -c 'until [ "$(docker inspect -f {{.State.Health.Status}} standalone)" = healthy ]; do sleep 5; done'
          tests/smoke.sh

      - name: Journaux en cas d'échec
        if: failure()
        run: |
          docker compose logs --tail=100 || true
          docker logs standalone --tail=100 || true

  compat-ban:
    name: Compatibilité avec le bundle BAN France
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Construction des images
        run: docker compose --profile '*' build

      - name: Installation du bundle BAN France (~2,4 Go, ~6 Go de RAM)
        run: START_TIMEOUT=1200 ./update-data.sh

      - name: Tests fonctionnels
        run: tests/smoke.sh

      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose logs --tail=100

  publish:
    name: Publication des images (amd64 + arm64)
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Préfixe des images et étiquette
        run: |
          echo "PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/geocodeur-infostat" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then echo "TAG=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; else echo "TAG=latest" >> "$GITHUB_ENV"; fi

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: addok
        uses: docker/build-push-action@v7
        with:
          context: addok
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.PREFIX }}-addok:${{ env.TAG }}

      - name: addok-redis
        uses: docker/build-push-action@v7
        with:
          context: addok-redis
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.PREFIX }}-addok-redis:${{ env.TAG }}

      - name: proxy
        uses: docker/build-push-action@v7
        with:
          context: proxy
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.PREFIX }}-proxy:${{ env.TAG }}

      - name: addok-standalone
        uses: docker/build-push-action@v7
        with:
          context: addok-standalone
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            ADDOK_IMAGE=${{ env.PREFIX }}-addok:${{ env.TAG }}
            REDIS_IMAGE=${{ env.PREFIX }}-addok-redis:${{ env.TAG }}
          tags: ${{ env.PREFIX }}-addok-standalone:${{ env.TAG }}
