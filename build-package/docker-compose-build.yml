name: geocodeur-infostat-build

# Construction d'un bundle (addok.db + dump.rdb + addok.conf) à partir de fichiers .ndjson.gz.
# Utilisé par build-package/run.sh, qui fournit HOST_UID / HOST_GID.

services:
  importer:
    build: ../addok
    image: geocodeur-infostat/addok:1.3.2
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    profiles: [tools]
    entrypoint: ["addok"]
    volumes:
      - ./addok.conf:/etc/addok/addok.conf:ro
      - ../dist:/data
    depends_on:
      redis:
        condition: service_healthy

  redis:
    build: ../addok-redis
    image: geocodeur-infostat/addok-redis:8.10
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ../dist:/data
