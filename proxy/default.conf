# Proxy devant l'instance addok active (« blue » ou « green », voir docker-compose.yml).
# Pour basculer, update-data.sh réécrit run/active.conf puis recharge nginx (nginx -s reload) :
# les requêtes en cours se terminent sur l'ancienne instance, les suivantes vont sur la nouvelle.

server {
    listen 7878;

    # Résolveur DNS de Docker : le nom de l'instance est résolu à chaque requête,
    # le proxy démarre donc même si l'instance n'existe pas encore
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Instance par défaut, remplacée par run/active.conf (« set $addok_upstream addok-green; »)
    set $addok_upstream addok-blue;
    include /etc/nginx/active/*.conf;

    # Géocodage de fichiers CSV : pas de limite de taille, jusqu'à 5 minutes de traitement
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location = /proxy-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://$addok_upstream:7878;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
