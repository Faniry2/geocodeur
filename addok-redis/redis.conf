# Configuration Redis pour addok : l'index est chargé depuis /data/dump.rdb au démarrage
# et n'est jamais réécrit (les données ne changent qu'avec un nouveau bundle).

bind * -::*
port 6379
# Pas de mot de passe : ne jamais publier ce port hors du réseau Docker
protected-mode no

dir /data
dbfilename dump.rdb
save ""
appendonly no

loglevel notice
logfile ""
